<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CaXino-X Admin</title><style>body{background:#000;color:#fff;font-family:system-ui;padding:16px}.box{background:#111;border:1px solid #ffd700;border-radius:12px;padding:12px;margin:10px 0}button{background:#ffd700;color:#000;font-weight:800;padding:10px;border-radius:8px;border:none;width:100%;margin:5px 0}</style></head><body><h2>CaXino-X ADMIN - Fee Locked R2</h2><div class="box"><div>🏦 House Wallet: R<b id="h">0</b></div><div>💰 Fee Profit (R2 x cashouts): R<b id="f">0</b></div><div>Reserve: <input id="res" value="500" style="width:60px;background:#222;color:#fff;border:1px solid #333"></div><div>Withdrawable: R<b id="w">0</b></div><button onclick="calc()">CALC 30 DAYS</button><div id="proj" style="font-size:.8rem;margin-top:8px"></div></div><div class="box"><h3>OTT Requests - Send Net Amount</h3><div id="list"></div></div><div class="box"><h3>Projector</h3>Players/day <input id="p" value="100" style="width:80px"> Avg stake R<input id="s" value="20" style="width:60px"><button onclick="project()">PROJECT</button><div id="pr"></div></div><script>  
function load(){let house=parseInt(localStorage.getItem('house_wallet')||0),fee=parseInt(localStorage.getItem('fee_profit')||0),res=parseInt(document.getElementById('res').value||500);document.getElementById('h').innerText=house;document.getElementById('f').innerText=fee;document.getElementById('w').innerText=Math.max(0,house+fee-res);let reqs=JSON.parse(localStorage.getItem('ott_reqs')||'[]');document.getElementById('list').innerHTML=reqs.map((r,i)=>`<div style="background:#222;padding:8px;border-radius:6px;margin:4px 0">${i+1}. ${r.date} <b>${r.name} ${r.surname}</b> ID:${r.id}<br>REQUESTED R${r.amt} - LOCKED FEE R${r.fee}= <b style="color:#00ff88">SEND R${r.net} OTT</b> → ${r.to=='email'?r.email:r.wa}</div>`).join('')||'No requests';}  
function calc(){let h=parseInt(localStorage.getItem('house_wallet')||0),f=parseInt(localStorage.getItem('fee_profit')||0);document.getElementById('proj').innerHTML=`30 days if R100/day: House R3000 + Fees R300 = R3300 Total<br>Withdrawable: R${h+f-500}`;}  
function project(){let players=parseInt(document.getElementById('p').value||100),stake=parseInt(document.getElementById('s').value||20),pools=Math.floor(players/20),profit50=pools*stake*10,fees=players*2,day=profit50+fees;document.getElementById('pr').innerHTML=`${pools} pools x R${stake*10} = R${profit50} + Fees R${fees} = <b>R${day}/day</b><br>Month: R${day*30}<br>Withdrawable after R500 reserve: R${day*30-500}`;}  
load();setInterval(load,2000);  
</script></body></html>
