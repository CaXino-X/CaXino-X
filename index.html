<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaXino-X - Play & Win</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:2.5rem;margin:20px 0;background:linear-gradient(90deg,#ffd700,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.balance{font-size:1.3rem;background:#1a1a24;padding:12px 24px;border-radius:30px;border:1px solid #ffd700;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;max-width:400px;width:100%}
.card{background:linear-gradient(145deg,#1e1e30,#151525);border:1px solid #333;border-radius:20px;padding:25px 15px;text-align:center;cursor:pointer}
.card span{font-size:2.5rem;display:block;margin-bottom:10px}
.card h3{color:#ffd700;margin-bottom:5px}
#gameArea{margin-top:30px;background:#1a1a24;border-radius:20px;padding:20px;width:100%;max-width:400px;display:none;border:1px solid #ffd700}
button{background:linear-gradient(90deg,#ffd700,#ff8c00);border:none;color:#000;font-weight:800;padding:14px 28px;border-radius:12px;font-size:1rem;cursor:pointer;width:100%;margin-top:15px}
.result{font-size:1.5rem;text-align:center;margin:15px 0;min-height:40px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#0a0a0f;color:#fff;text-align:center;font-size:1.2rem;margin-top:10px}
</style>
</head>
<body>
<h1>CaXino-X</h1>
<div class="balance">💰 Balance: R<span id="bal">1000</span></div>
<div class="grid" id="menu">
<div class="card" onclick="openGame('coin')"><span>🪙</span><h3>Coin Flip</h3><p>50/50 Double</p></div>
<div class="card" onclick="openGame('dice')"><span>🎲</span><h3>Dice Roll</h3><p>Roll 4+ to win</p></div>
<div class="card" onclick="openGame('slots')"><span>🎰</span><h3>Mini Slots</h3><p>Jackpot X10</p></div>
<div class="card" onclick="openGame('crash')"><span>🚀</span><h3>Crash</h3><p>Cashout</p></div>
</div>
<div id="gameArea">
<h2 id="gTitle" style="text-align:center;color:#ffd700"></h2>
<div class="result" id="result">Good luck!</div>
<input type="number" id="bet" value="50" min="10">
<button id="playBtn" onclick="play()">PLAY - BET</button>
<button onclick="closeGame()" style="background:#222;color:#fff;margin-top:10px">← BACK</button>
</div>
<script>
let bal=1000, current='coin', crashPoint=0;
function openGame(g){current=g;document.getElementById('menu').style.display='none';document.getElementById('gameArea').style.display='block';document.getElementById('gTitle').innerText=g.toUpperCase();document.getElementById('result').innerText='Ready!';}
function closeGame(){document.getElementById('menu').style.display='grid';document.getElementById('gameArea').style.display='none';}
function play(){
 let bet=parseInt(document.getElementById('bet').value);
 if(bet>bal||bet<10){alert('Invalid bet!');return;}
 bal-=bet;
 let win=false, mult=0, msg='';
 if(current==='coin'){win=Math.random()>0.5;mult=2;msg=win?'🪙 WIN!':'🪙 LOSE!';}
 else if(current==='dice'){let r=Math.floor(Math.random()*6)+1;win=r>=4;mult=2;msg=`🎲 ${r} - ${win?'WIN!':'LOSE!'}`;}
 else if(current==='slots'){let s=['🍒','🍋','💎'];let a=s[Math.floor(Math.random()*3)],b=s[Math.floor(Math.random()*3)],c=s[Math.floor(Math.random()*3)];win=(a===b&&b===c);mult=win?(a==='💎'?10:5):0;msg=`${a}${b}${c} ${win?'JACKPOT!':''}`;}
 else if(current==='crash'){let m=(Math.random()*4+1).toFixed(2);crashPoint=(Math.random()*3+1).toFixed(2);win=parseFloat(m)<parseFloat(crashPoint);mult=win?parseFloat(m):0;msg=win?`🚀 ${m}x WIN!`:`💥 Crashed at ${crashPoint}x`;}
 if(win){let w=Math.floor(bet*mult);bal+=w;msg+=` +R${w}`;}
 document.getElementById('result').innerText=msg;
 document.getElementById('bal').innerText=bal;
}
</script>
</body>
</html>
